name: Empirical cardiorespiratory torus study

on:
  pull_request:
    branches: [main]
    paths:
      - 'empirical/**'
      - '.github/workflows/empirical-cardiorespiratory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  empirical-study:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wfdb numpy pandas scipy matplotlib scikit-learn statsmodels ripser tabulate
      - name: Run empirical study
        id: empirical
        continue-on-error: true
        env:
          EMPIRICAL_OUT: empirical_results
          PHYSIONET_DATA: physionet_data
        run: |
          mkdir -p empirical_results
          set -o pipefail
          python empirical/run_empirical_cardiorespiratory_corrected.py 2>&1 | tee empirical_results/workflow_run.log
      - name: Archive results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empirical-cardiorespiratory-results
          path: empirical_results
          retention-days: 30
      - name: Commit reproducible results and logs to study branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add empirical_results
          git commit -m 'Add empirical cardiorespiratory results and logs' || exit 0
          git push origin HEAD:${{ github.head_ref }}
      - name: Propagate analysis failure
        if: steps.empirical.outcome == 'failure'
        run: exit 1
